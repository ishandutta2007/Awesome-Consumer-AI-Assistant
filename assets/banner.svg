<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .dynamic-bg-circle { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .floating-card-1 { animation: float1 5s ease-in-out infinite; transform-origin: center; }
    .floating-card-2 { animation: float2 7s ease-in-out infinite; transform-origin: center; }
    .animated-line { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="12" />

  <!-- Dynamic Glowing Background Orbs (Behind text) -->
  <circle class="dynamic-bg-circle" cx="200" cy="100" r="140" fill="#58a6ff" opacity="0.15" filter="url(#glow)" />
  <circle class="dynamic-bg-circle" cx="1000" cy="250" r="160" fill="#bc8cff" opacity="0.15" filter="url(#glow)" />

  <!-- Dynamic Decorative Background Elements (Low opacity, behind foreground) -->
  <g opacity="0.25">
    <path class="animated-line" d="M 50 280 Q 300 320 600 270 T 1150 290" stroke="url(#accent-grad)" stroke-width="2" fill="none" />
    <path class="animated-line" d="M 100 60 Q 400 20 800 70 T 1100 40" stroke="url(#accent-grad)" stroke-width="1.5" fill="none" />
  </g>

  <!-- Dynamic Floating Decorative Cards (Positioned away from central text) -->
  <g class="floating-card-1" opacity="0.45">
    <rect x="80" y="210" width="180" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="105" cy="235" r="10" fill="#58a6ff" />
    <rect x="125" y="227" width="110" height="6" rx="3" fill="#8b949e" />
    <rect x="125" y="238" width="70" height="6" rx="3" fill="#484f58" />
  </g>

  <g class="floating-card-2" opacity="0.45">
    <rect x="940" y="80" width="190" height="55" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="968" cy="107" r="10" fill="#bc8cff" />
    <rect x="990" y="98" width="115" height="6" rx="3" fill="#8b949e" />
    <rect x="990" y="110" width="80" height="6" rx="3" fill="#484f58" />
  </g>

  <!-- Foreground Banner Top/Bottom Accent Borders -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent-grad)" />
  <rect x="0" y="346" width="1200" height="4" fill="url(#accent-grad)" />

  <!-- Foreground Title and Subtitle Content (High Visibility) -->
  <g text-anchor="middle">
    <!-- Top Pill / Badge -->
    <rect x="470" y="45" width="260" height="32" rx="16" fill="#21262d" stroke="#363b42" stroke-width="1" />
    <text x="600" y="66" fill="#58a6ff" font-size="13" font-weight="600" letter-spacing="1.5">OCTOBER 2026 EDITION</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#text-grad)" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome Consumer AI Assistant</text>

    <!-- Subtitle -->
    <text x="600" y="195" fill="#c9d1d9" font-size="19" font-weight="400">Curated SaaS Platforms, Self-Hosted Tools &amp; Local Multimodal AI Models</text>

    <!-- Feature Pills -->
    <g font-size="13" font-weight="500">
      <!-- Pill 1 -->
      <rect x="330" y="240" width="160" height="36" rx="18" fill="#161b22" stroke="#30363d" />
      <circle cx="352" cy="258" r="5" fill="#3fb950" />
      <text x="417" y="263" fill="#8b949e">SaaS &amp; Pricing Tiers</text>

      <!-- Pill 2 -->
      <rect x="510" y="240" width="180" height="36" rx="18" fill="#161b22" stroke="#30363d" />
      <circle cx="532" cy="258" r="5" fill="#bc8cff" />
      <text x="607" y="263" fill="#8b949e">Open-Source Alternatives</text>

      <!-- Pill 3 -->
      <rect x="710" y="240" width="160" height="36" rx="18" fill="#161b22" stroke="#30363d" />
      <circle cx="732" cy="258" r="5" fill="#58a6ff" />
      <text x="797" y="263" fill="#8b949e">Local LLM Runners</text>
    </g>
  </g>
</svg>
